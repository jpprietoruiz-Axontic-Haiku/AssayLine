services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assayline
      POSTGRES_PASSWORD: assayline
      POSTGRES_DB: assayline
    ports:
      - "5432:5432"
    volumes:
      - assayline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assayline -d assayline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assayline_pg_data:
